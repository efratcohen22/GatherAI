[project]
name = "gatherai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.20,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2",
  "email-validator>=2",
  "pyjwt[crypto]>=2.15,<3",
  "anthropic>=2.6,<3",
  "psycopg[binary]>=3.3,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = ["B008"]
